# SPX Voice — Acceptance environment isolated services
# Containers (all published to 127.0.0.1 only — no LAN exposure):
#   spx-accept-pg-20261121    : Postgres 17  :  127.0.0.1:55444      -> 5432
#   spx-accept-redis-20261121 : Redis 7      :  127.0.0.1:6384       -> 6379
#   spx-accept-lk-20261121    : LiveKit v1.8 :  127.0.0.1:7880       -> 7880      (HTTP/WS signaling, TCP)
#                                               127.0.0.1:7881       -> 7881      (RTC TCP fallback, TCP)
#                                               127.0.0.1:51000-51019 -> 51000-51019/udp (WebRTC media/ICE)
#
# Corrected 2026-11-21: 7881 must be TCP (RTC fallback), not UDP — the earlier
# draft mapped it as UDP and omitted the real WebRTC media port range
# (50000-60000 UDP by LiveKit --dev default). Without the UDP range exposed,
# signaling (room join) succeeds but audio media cannot flow.
#
# Corrected again 2026-11-21 (second pass): the original 50000-50019 choice
# collides with a Windows "administered" (Hyper-V/WSL-reserved) UDP
# exclusion covering 50000-50059 on this host -- confirmed via `netsh
# interface ipv4 show excludedportrange protocol=udp` -- which made `docker
# compose up` fail with "ports are not available ... forbidden by its
# access permissions" (WSAEACCES) on the LiveKit container specifically.
# Moved to 51000-51019, confirmed clear of every excluded range on this
# host. Re-check with the same netsh command if this ever collides again
# (Windows can add new exclusions after a reboot or VPN/Hyper-V changes),
# and pick a free 20-port block between the listed exclusion ranges.
#
# Also added `--udp-port 51000-51019` to the container command so LiveKit's
# own internal RTC port range matches the host-published range exactly.
# Without this, the container would still listen on its *default* internal
# range (50000-60000) while Docker only published 51000-51019 on the host,
# and LiveKit would advertise the wrong (internal, unreachable) port in its
# ICE candidates -- signaling would succeed but audio would silently fail
# again, just from a different cause than the original TCP/UDP mistake.
# Range narrowed to 20 ports for a single local test session; widen both
# this host range and --udp-port together if running multiple concurrent
# sessions and seeing ICE failures.
#
# Start :  docker compose -f accept\docker-compose.accept.yaml up -d
# Stop  :  docker compose -f accept\docker-compose.accept.yaml down
# Wipe  :  docker compose -f accept\docker-compose.accept.yaml down -v

services:
  accept-postgres:
    image: pgvector/pgvector:pg17
    container_name: spx-accept-pg-20261121
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spx_voice_accept
    ports:
      - "127.0.0.1:55444:5432"
    volumes:
      - spx_accept_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15

  accept-redis:
    image: redis:7
    container_name: spx-accept-redis-20261121
    ports:
      - "127.0.0.1:6384:6379"
    command: ["redis-server", "--requirepass", "REDIS_PASSWORD_PLACEHOLDER"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "REDIS_PASSWORD_PLACEHOLDER", "ping"]
      interval: 3s
      timeout: 10s
      retries: 15

  accept-livekit:
    image: livekit/livekit-server:v1.8.0
    container_name: spx-accept-lk-20261121
    # --bind 0.0.0.0 controls the interface INSIDE the container's own network
    # namespace (required for Docker's host port mapping to work at all); it
    # does not by itself expose anything beyond what "ports:" below publishes.
    command: ["--dev", "--bind", "0.0.0.0", "--udp-port", "51000-51019"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:51000-51019:51000-51019/udp"
    # Dev mode fixed credentials: key=devkey  secret=secret
    # These are well-known public dev values documented by LiveKit itself;
    # not production secrets, and not treated as sensitive in this file.

volumes:
  spx_accept_pg_data:
    name: spx_accept_pg_data_20261121
